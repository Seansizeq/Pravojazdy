# /etc/nginx/sites-available/pdrpl — статична збірка гри (HTTPS додає certbot)
server {
    listen 80;
    listen [::]:80;
    server_name pravojazdy.vibelearn.site;

    root /var/www/pdrpl;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # файли з хешем у назві можна кешувати назавжди
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
